version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci

  # Runtime nie ma zależności — composer.json deklaruje wyłącznie rozszerzenia
  # PHP. Starzeją się natomiast narzędzia jakości z require-dev.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
