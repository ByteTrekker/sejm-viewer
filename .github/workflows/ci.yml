name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nowy push do tej samej gałęzi anuluje poprzedni przebieg — nie płacimy
# za weryfikację nieaktualnego kodu.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commits:
    name: Konwencja commitów
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Komunikaty commitów
        run: ./scripts/check-commits.sh "origin/${{ github.base_ref }}..HEAD"

      - name: Tytuł pull requesta
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: ./scripts/check-commits.sh --subject "$PR_TITLE"

  # Runtime deklaruje PHP 8.2 i zero zależności. Ten job to sprawdza dosłownie:
  # bez composera, na najniższej wspieranej wersji. Gdyby do bin/ albo src/
  # wszedł kiedyś `use` z vendora, ta bramka zapali się natychmiast.
  runtime:
    name: Runtime bez zależności (PHP 8.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, curl, mbstring
          coverage: none

      - name: Składnia
        run: ./scripts/php-lint.sh

      - name: Test dymny metodologii (bez sieci, bez composera)
        run: ./scripts/smoke.sh

  php:
    name: Bramki jakości
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          # PHPUnit 13 wymaga 8.4; runtime i tak jest weryfikowany osobno na 8.2.
          php-version: '8.4'
          extensions: pdo_sqlite, curl, mbstring
          # pcov, a nie xdebug: potrzebujemy pokrycia do progu i do mutacji,
          # a pcov jest wielokrotnie szybszy przy tym samym wyniku liniowym.
          coverage: pcov

      - uses: ramsey/composer-install@v3

      - name: Styl (PSR-12)
        if: always()
        run: vendor/bin/php-cs-fixer check --diff

      - name: Analiza statyczna (PHPStan, poziom 8)
        if: always()
        run: php -d memory_limit=1G vendor/bin/phpstan analyse --no-progress --error-format=github

      - name: Testy jednostkowe z progiem pokrycia
        if: always()
        run: ./scripts/check-coverage.sh 90

      - name: Testy mutacyjne warstwy czystej
        if: always()
        run: ./scripts/check-mutation.sh

      - name: Audyt zależności
        if: always()
        run: composer audit

  artefakty:
    name: Artefakty generowane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Wygenerowane dashboardy mają setki kilobajtów zapieczonych danych.
      # Wersjonowanie ich zamienia diff w szum i rozjeżdża się ze źródłem.
      - name: Brak wygenerowanych plików w repozytorium
        run: |
          found=0
          for path in public/index.html public/interpelacje.html public/droga.html \
                      public/poslowie.html public/nieobecnosci.html public/dyscyplina.html \
                      public/koalicje.html public/raporty.html \
                      public/vacatio.html public/vacatio-merytoryczne.html \
                      public/posel var/sejm.sqlite; do
            if [ -e "$path" ]; then
              echo "BŁĄD: $path jest wygenerowany i nie powinien być w repozytorium"
              found=1
            fi
          done
          exit "$found"

      - name: Szablony mają komplet znaczników
        run: |
          for tpl in public/pages/*.html; do
            grep -q '<!--@style-->' "$tpl" || { echo "BŁĄD: brak <!--@style--> w $tpl"; exit 1; }
            grep -q '<!--@nav-->'   "$tpl" || { echo "BŁĄD: brak <!--@nav--> w $tpl"; exit 1; }
            grep -q '/\*@core\*/'   "$tpl" || { echo "BŁĄD: brak /*@core*/ w $tpl"; exit 1; }
            grep -q '/\*__DATA__\*/null' "$tpl" || { echo "BŁĄD: brak /*__DATA__*/null w $tpl"; exit 1; }
          done
          test -f public/partials/style.css && test -f public/partials/core.js && test -f public/partials/nav.html
          echo "OK   $(ls public/pages/*.html | wc -l | tr -d ' ') szablonów, komplet części wspólnych"
